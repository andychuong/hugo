name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact_name: hugo-manager-macos-universal
          - os: windows-latest
            platform: windows/amd64
            artifact_name: hugo-manager-windows-amd64
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: hugo-manager-linux-amd64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: manager/hugo-manager/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manager/hugo-manager/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # macOS dependencies (none needed beyond Xcode command line tools)
      
      # Windows dependencies (none needed)

      - name: Install frontend dependencies
        working-directory: manager/hugo-manager/frontend
        run: npm ci

      - name: Build application
        working-directory: manager/hugo-manager
        run: wails build -platform ${{ matrix.platform }}

      # Package the build artifacts
      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        working-directory: manager/hugo-manager/build/bin
        run: |
          # Create a zip of the .app bundle
          zip -r ${{ matrix.artifact_name }}.zip hugo-manager.app

      - name: Package Windows app
        if: matrix.os == 'windows-latest'
        working-directory: manager/hugo-manager/build/bin
        run: |
          Compress-Archive -Path hugo-manager.exe -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package Linux app
        if: matrix.os == 'ubuntu-latest'
        working-directory: manager/hugo-manager/build/bin
        run: |
          chmod +x hugo-manager
          tar -czvf ${{ matrix.artifact_name }}.tar.gz hugo-manager

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: manager/hugo-manager/build/bin/${{ matrix.artifact_name }}.zip

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: manager/hugo-manager/build/bin/${{ matrix.artifact_name }}.zip

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: manager/hugo-manager/build/bin/${{ matrix.artifact_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Hugo Manager ${{ steps.tag.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/hugo-manager-macos-universal/hugo-manager-macos-universal.zip
            artifacts/hugo-manager-windows-amd64/hugo-manager-windows-amd64.zip
            artifacts/hugo-manager-linux-amd64/hugo-manager-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
